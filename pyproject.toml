[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burnmap"
version = "0.1.0"
description = "Calibrated weak supervision for post-harvest burned-cropland mapping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "earthengine-api==1.7.22",
    "scikit-learn==1.8.0",
    "xgboost==3.2.0",
    "lightgbm==4.6.0",
    "torch==2.11.0",
    "numpy==2.4.4",
    "pandas==3.0.2",
    "matplotlib==3.10.8",
    "rasterio==1.5.0",
    "geopandas==1.1.3",
    "scipy==1.17.1",
    "pillow==12.2.0",
    "requests==2.33.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["burnmap*"]
